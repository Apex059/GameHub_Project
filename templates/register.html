{% extends "base.html" %}{% block title %}Register — GameHub{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><h2>Create your GameHub profile</h2><p class="text-muted">Choose your favorite genres to improve recommendations.</p>
<form method="post"><label>Username</label><input name="username" class="form-control mb-3" minlength="3" required><label>Email</label><input name="email" type="email" class="form-control mb-3" required><label>Password</label><input name="password" type="password" class="form-control mb-3" minlength="6" required><label class="mb-2">Favorite genres</label><div class="genre-grid mb-4">{% for g in ['FPS','RPG','Sandbox','Battle Royale','Sports','Simulation'] %}<label class="genre-choice"><input type="checkbox" name="genres" value="{{ g }}"> {{ g }}</label>{% endfor %}</div><button class="btn btn-primary w-100">Create Account</button></form></div></div>{% endblock %}
