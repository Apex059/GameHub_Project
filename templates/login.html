{% extends "base.html" %}{% block title %}Login — GameHub{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="text-center mb-4"><div class="hero-icon small"><i class="bi bi-controller"></i></div><h2>Welcome back</h2><p class="text-muted">Log in to your GameHub account.</p></div>
<form method="post"><label>Username or Email</label><input name="identifier" class="form-control mb-3" required><label>Password</label><input name="password" type="password" class="form-control mb-4" required><button class="btn btn-primary w-100">Login</button></form>
<p class="text-center mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
