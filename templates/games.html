{% extends "base.html" %}{% block title %}Games — GameHub{% endblock %}
{% block content %}<div class="container py-5"><div class="section-head"><div><span class="eyebrow dark">CATALOG</span><h1>Explore Games</h1></div></div>
<form class="filter-bar row g-2 mb-4"><div class="col-md-5"><input name="q" value="{{ q }}" class="form-control" placeholder="Search games..."></div><div class="col-md-3"><select name="genre" class="form-select"><option value="">All genres</option>{% for g in genres %}<option {% if selected_genre==g.genre %}selected{% endif %}>{{ g.genre }}</option>{% endfor %}</select></div><div class="col-md-3"><select name="platform" class="form-select"><option value="">All platforms</option><option {% if selected_platform=='PC' %}selected{% endif %}>PC</option><option>Console</option><option>Mobile</option></select></div><div class="col-md-1"><button class="btn btn-primary w-100"><i class="bi bi-search"></i></button></div></form>
<div class="row g-4">{% for game in games %}<div class="col-sm-6 col-lg-4"><a class="game-card" href="{{ url_for('game_detail', game_id=game.id) }}"><img src="{{ game.image }}" alt="{{ game.title }}"><div class="game-card-body"><span>{{ game.genre }}</span><h4>{{ game.title }}</h4><small>{{ game.platform }}</small></div></a></div>{% else %}<div class="empty">No games found.</div>{% endfor %}</div></div>{% endblock %}
